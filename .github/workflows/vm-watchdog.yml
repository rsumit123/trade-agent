name: VM Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check VM status and restart if needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS=$(gcloud compute instances describe socialflow \
            --zone us-east1-d \
            --format="value(status)" 2>/dev/null || echo "UNKNOWN")

          echo "VM status: $STATUS"

          if [ "$STATUS" = "TERMINATED" ] || [ "$STATUS" = "STOPPED" ]; then
            echo "VM is $STATUS - restarting..."
            gcloud compute instances start socialflow --zone us-east1-d
            echo "VM restart triggered"

            curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=VM Auto-Restart: Spot VM was ${STATUS}. GitHub Actions watchdog triggered restart. Boot alert will follow."
          else
            echo "VM is $STATUS - no action needed"
          fi
